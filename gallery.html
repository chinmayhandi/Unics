<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Unics Computer Coaching</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="View our state-of-the-art computer labs, classrooms, and student activities at Unics Computer Coaching.">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .gallery-item {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 4/3;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .gallery-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: var(--transition);
        }
        .gallery-overlay i {
            color: white;
            font-size: 2rem;
            transform: scale(0.5);
            transition: var(--transition);
        }
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }
        .gallery-item:hover .gallery-overlay i {
            transform: scale(1);
        }
    </style>
</head>
<body>
    <!-- Preloader -->
    <div class="preloader">
        <div class="loader"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar scrolled">
        <div class="container">

            </a>
            <div class="mobile-toggle" style="color: var(--primary);">
                <i class="fa-solid fa-bars"></i>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link" style="color: var(--text-main);">Home</a></li>
                <li><a href="about.html" class="nav-link" style="color: var(--text-main);">About Us</a></li>
                <li><a href="courses.html" class="nav-link" style="color: var(--text-main);">Courses</a></li>
                <li><a href="gallery.html" class="nav-link active" style="color: var(--text-main);">Gallery</a></li>
                <li><a href="contact.html" class="nav-link" style="color: var(--text-main);">Contact</a></li>
                <li><a href="contact.html" class="btn btn-primary" style="margin-left: 1rem;">Join Now</a></li>
            </ul>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="py-20 text-center" style="background: var(--bg-color); margin-top: 80px;">

            <p class="section-subtitle reveal">Take a look at our state-of-the-art infrastructure and student activities.</p>
        </div>
    </header>

    <!-- Gallery Grid -->
    <section class="py-16">
        <div class="container">
            <div class="gallery-grid">
                <div class="gallery-item reveal">
                    <img src="https://images.unsplash.com/photo-1531482615713-2afd69097998?q=80&w=2070&auto=format&fit=crop" alt="Lab 1">
                    <div class="gallery-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
                </div>
                <div class="gallery-item reveal">
                    <img src="https://images.unsplash.com/photo-1516321497487-e288fb19713f?q=80&w=2070&auto=format&fit=crop" alt="Lab 2">
                    <div class="gallery-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
                </div>
                <div class="gallery-item reveal">
                    <img src="https://images.unsplash.com/photo-1544531586-fde5298cdd40?q=80&w=2070&auto=format&fit=crop" alt="Classroom">
                    <div class="gallery-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
                </div>
                <div class="gallery-item reveal">
                    <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=2070&auto=format&fit=crop" alt="Students">
                    <div class="gallery-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
                </div>
                <div class="gallery-item reveal">

        </div>
    </section>

    <!-- Footer -->

    <script src="js/main.js"></script>
</body>
</html>
